<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E242D" />
      <stop offset="50%" stop-color="#13161C" />
      <stop offset="100%" stop-color="#0B0D10" />
    </linearGradient>
    <linearGradient id="favSun" x1="32" y1="16" x2="32" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="favAzzurro" x1="18" y1="49.5" x2="43" y2="49.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Base container with rounded arch shape -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="#374151" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Italian Tricolor Dots (Verde, Bianco, Rosso) -->
  <circle cx="23" cy="11" r="2.2" fill="#16A34A" />
  <circle cx="32" cy="11" r="2.2" fill="#F8FAFC" />
  <circle cx="41" cy="11" r="2.2" fill="#DC2626" />

  <!-- Roman Arch Portal Frame -->
  <path d="M16 48 V27 C16 18.163 23.163 11 32 11 C40.837 11 48 18.163 48 27 V48" stroke="#E5E7EB" stroke-width="1.2" stroke-opacity="0.22" stroke-dasharray="2 2" />

  <!-- Radiant Tuscan Sun -->
  <circle cx="32" cy="23" r="5.5" fill="url(#favSun)" />

  <!-- Monogram "L" and "I" (Life in Italia) -->
  <path d="M18 26 H23.5 V41.5 H32.5 V46 H18 Z" fill="#FFFFFF" />
  <path d="M37.5 26 H43 V46 H37.5 Z" fill="#FFFFFF" />

  <!-- Mediterranean Blue Horizon Line -->
  <rect x="18" y="49.5" width="25" height="3" rx="1.5" fill="url(#favAzzurro)" />
</svg>
